<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>SYNQ Admin</title><style>
:root{--bg:#080808;--panel:#121212;--field:#191919;--line:rgba(255,255,255,.1);--text:#f5f4f0;--muted:#888;--gold:#c0a87c;--green:#32c975}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1060px,calc(100% - 30px));margin:auto;padding:32px 0 75px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:26px;border-bottom:1px solid var(--line)}header img{width:90px;height:55px;object-fit:cover}.status{font-size:11px;color:var(--muted)}.status.ok{color:var(--green)}h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.055em;margin:54px 0 10px}.intro{color:#8d8d8d;margin:0 0 35px}.login{max-width:440px;margin:60px auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.login h2{margin-top:0}.notice{margin-top:20px;padding:17px;border:1px solid rgba(192,168,124,.35);background:rgba(192,168,124,.08);border-radius:11px;color:#c9b894;font-size:13px;line-height:1.55}.field{display:grid;gap:7px;margin-bottom:14px}label{font-size:11px;color:#999}input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;color:white;padding:13px 14px;font:inherit}.btn{border:1px solid var(--line);background:#eee;color:#080808;border-radius:999px;padding:12px 19px;font-weight:700;cursor:pointer}.btn.secondary{background:transparent;color:white}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:64px 1fr auto;gap:15px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.row img{width:64px;aspect-ratio:1;object-fit:cover;border-radius:7px}.row h3{margin:0 0 5px;font-size:15px}.row p{margin:0;color:#777;font-size:11px}.edit{display:flex;gap:8px}.edit button{background:#1b1b1b;color:white;border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);display:none;place-items:center;padding:20px}.drawer.open{display:grid}.form{width:min(650px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid var(--line);border-radius:18px;padding:24px}.form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.form-head h2{margin:0}.close{width:38px;height:38px;border-radius:50%;border:0;background:#222;color:white;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.checks{display:flex;align-items:center;gap:20px}.checks label{display:flex;align-items:center;gap:7px}.checks input{width:auto}.savebar{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.hidden{display:none!important}@media(max-width:620px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:55px 1fr}.row img{width:55px}.edit{grid-column:1/-1;justify-content:flex-end}.toolbar{flex-direction:column}.drawer{align-items:end;padding:0}.form{border-radius:20px 20px 0 0;max-height:94vh}}
</style></head><body><div class="shell"><header><img src="assets/synq-logo.webp" alt="SYNQ Studios"><div class="status" id="status">Kontrolpanel</div></header><div id="loginView" class="login"><h2>Log ind</h2><p class="intro">Kun ejeren kan ændre hjemmesiden.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Adgangskode</label><input id="password" type="password"></div><button class="btn" id="loginBtn">Log ind</button><div class="notice" id="setupNotice">Databasen er ikke forbundet endnu. Når Supabase er oprettet, aktiveres login og online gemning.</div></div><main id="adminView" class="hidden"><h1>Udgivelser</h1><p class="intro">Tilføj og redigér musik på SYNQ Studios-siden.</p><div class="toolbar"><button class="btn" id="newBtn">+ Ny udgivelse</button><button class="btn secondary" id="logoutBtn">Log ud</button></div><div class="list" id="releaseList"></div></main></div>
<div class="drawer" id="drawer"><form class="form" id="releaseForm"><div class="form-head"><h2 id="formTitle">Ny udgivelse</h2><button type="button" class="close" id="closeDrawer">×</button></div><div class="fields"><input type="hidden" id="releaseId"><div class="field full"><label>Titel</label><input id="title" required></div><div class="field"><label>Udgivelsesdato</label><input id="releaseDate" type="date" required></div><div class="field"><label>Rækkefølge</label><input id="sortOrder" type="number" min="1" value="1"></div><div class="field full"><label>Cover</label><input id="coverFile" type="file" accept="image/*"><input id="coverUrl" type="hidden"></div><div class="field full"><label>Spotify-link</label><input id="spotifyUrl" type="url"></div><div class="field full"><label>Apple Music-link</label><input id="appleUrl" type="url"></div><div class="field full"><label>YouTube Music-link</label><input id="youtubeUrl" type="url"></div><div class="field full"><label>HyperFollow-link</label><input id="hyperfollowUrl" type="url"></div><div class="field"><label>Samlede afspilninger</label><input id="streams" type="number" min="0" value="0"></div><div class="field checks"><label><input id="featured" type="checkbox"> Seneste</label><label><input id="visible" type="checkbox" checked> Synlig</label></div></div><div class="savebar"><button type="button" class="btn secondary" id="cancelBtn">Annuller</button><button class="btn" type="submit">Gem</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s),cfg=window.SYNQ_CONFIG||{};let db=null,releases=[];const ready=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey);if(ready){db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);$("#setupNotice").classList.add("hidden")}async function init(){if(!db)return;const{data:{session}}=await db.auth.getSession();if(session)showAdmin();db.auth.onAuthStateChange((_e,s)=>s?showAdmin():showLogin())}async function login(){const{error}=await db.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(error)alert("Login mislykkedes: "+error.message)}function showLogin(){$("#loginView").classList.remove("hidden");$("#adminView").classList.add("hidden")}async function showAdmin(){$("#loginView").classList.add("hidden");$("#adminView").classList.remove("hidden");$("#status").textContent="Forbundet";$("#status").classList.add("ok");await load()}async function load(){const{data,error}=await db.from("releases").select("*").order("sort_order");if(error)return alert(error.message);releases=data||[];render()}function render(){$("#releaseList").innerHTML=releases.map(r=>'<div class="row"><img src="'+r.cover_url+'"><div><h3>'+r.title+(r.featured?" · Seneste":"")+'</h3><p>'+r.release_date+' · '+(r.visible?"Synlig":"Skjult")+'</p></div><div class="edit"><button onclick="editRelease(\''+r.id+'\')">Redigér</button><button onclick="deleteRelease(\''+r.id+'\')">Slet</button></div></div>').join("")}
function openForm(r={}){$("#releaseId").value=r.id||"";$("#title").value=r.title||"";$("#releaseDate").value=r.release_date||"";$("#sortOrder").value=r.sort_order||releases.length+1;$("#coverUrl").value=r.cover_url||"";$("#spotifyUrl").value=r.spotify_url||"";$("#appleUrl").value=r.apple_url||"";$("#youtubeUrl").value=r.youtube_url||"";$("#hyperfollowUrl").value=r.hyperfollow_url||"";$("#streams").value=r.streams||0;$("#featured").checked=!!r.featured;$("#visible").checked=r.visible!==false;$("#formTitle").textContent=r.id?"Redigér udgivelse":"Ny udgivelse";$("#drawer").classList.add("open")}window.editRelease=id=>openForm(releases.find(r=>r.id===id));window.deleteRelease=async id=>{if(!confirm("Vil du slette udgivelsen?"))return;const{error}=await db.from("releases").delete().eq("id",id);error?alert(error.message):load()};async function save(e){e.preventDefault();const id=$("#releaseId").value||crypto.randomUUID();let cover=$("#coverUrl").value,file=$("#coverFile").files[0];if(file){const path="covers/"+id+"-"+Date.now()+"."+file.name.split(".").pop();const{error}=await db.storage.from("covers").upload(path,file);if(error)return alert(error.message);cover=db.storage.from("covers").getPublicUrl(path).data.publicUrl}if(!cover)return alert("Vælg et cover");const row={id,title:$("#title").value,release_date:$("#releaseDate").value,sort_order:+$("#sortOrder").value,cover_url:cover,spotify_url:$("#spotifyUrl").value,apple_url:$("#appleUrl").value,youtube_url:$("#youtubeUrl").value,hyperfollow_url:$("#hyperfollowUrl").value,streams:+$("#streams").value,featured:$("#featured").checked,visible:$("#visible").checked};if(row.featured)await db.from("releases").update({featured:false}).neq("id",id);const{error}=await db.from("releases").upsert(row);if(error)alert(error.message);else{close();load()}}function close(){$("#drawer").classList.remove("open");$("#releaseForm").reset()}$("#loginBtn").onclick=()=>ready?login():alert("Supabase skal forbindes først.");$("#logoutBtn").onclick=()=>db.auth.signOut();$("#newBtn").onclick=()=>openForm();$("#closeDrawer").onclick=close;$("#cancelBtn").onclick=close;$("#releaseForm").onsubmit=save;init();
</script></body></html>
